name: Veto-UI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebstormProjects/veto-ui

    steps:
    - name: Check out frontend
      uses: actions/checkout@v4
      with:
        path: WebstormProjects/veto-ui

    - name: Check out shared backend API and plugin fixtures
      uses: actions/checkout@v4
      with:
        repository: MidCoard/veto
        path: IdeaProjects/veto

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: WebstormProjects/veto-ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint check
      run: npm run build # Vite build also runs tsc which checks types

    - name: Run tests
      run: npm test

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: WebstormProjects/veto-ui/dist/
